services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    expose:
      - "3000"
    volumes:
      - family_soft_data:/app/data
      - family_soft_uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  max-bot:
    build: .
    profiles:
      - max-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    command:
      - node
      - --use-system-ca
      - scripts/max-bot.js
    volumes:
      - family_soft_data:/app/data
      - family_soft_uploads:/app/uploads:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  family_soft_data:
  family_soft_uploads:
  caddy_data:
  caddy_config:
